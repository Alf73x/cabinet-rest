name: Cabinet REST CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Build
        run: go build ./...

  docker:
    runs-on: ubuntu-latest
    needs: build

    # Docker image публикуем только при push, не при pull request
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: |
            ghcr.io/alf73x/cabinet-rest:latest
            ghcr.io/alf73x/cabinet-rest:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Setup SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" 'bash -s' <<'EOF'
            cd /root/Programs/CabinetREST

            OLD_TAG="$(sed -n 's/^IMAGE_TAG=//p' .deploy.env)"
            NEW_TAG="${{ github.sha }}"

            if [ -z "$OLD_TAG" ]; then
              echo "Cannot determine current IMAGE_TAG"
              exit 1
            fi

            echo "Current version: $OLD_TAG"
            echo "New version:     $NEW_TAG"

            # Переключаем Compose на новый image
            printf 'IMAGE_TAG=%s\n' "$NEW_TAG" > .deploy.env

            echo "Pulling new image..."

            if ! docker compose --env-file .deploy.env pull; then
              echo "Image pull failed"
              printf 'IMAGE_TAG=%s\n' "$OLD_TAG" > .deploy.env
              exit 1
            fi

            echo "Starting new version..."

            if ! docker compose --env-file .deploy.env up -d; then
              echo "Container start failed. Rolling back..."

              printf 'IMAGE_TAG=%s\n' "$OLD_TAG" > .deploy.env

              docker compose --env-file .deploy.env pull || true
              docker compose --env-file .deploy.env up -d || true

              exit 1
            fi

            echo "Waiting for REST..."

            HEALTH_OK=false

            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:8082/health > /dev/null; then
                HEALTH_OK=true
                break
              fi

              echo "REST is not ready yet... ($i/15)"
              sleep 2
            done

            if [ "$HEALTH_OK" = true ]; then
              echo "REST health check OK"
              echo "Deployment successful: $NEW_TAG"
              exit 0
            fi

            echo "REST health check FAILED"
            echo "Logs from failed version:"
            docker logs --tail 100 cabinet-rest || true

            echo "Rolling back to: $OLD_TAG"

            printf 'IMAGE_TAG=%s\n' "$OLD_TAG" > .deploy.env

            docker compose --env-file .deploy.env pull
            docker compose --env-file .deploy.env up -d

            echo "Checking rollback..."

            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:8082/health > /dev/null; then
                echo "Rollback successful: $OLD_TAG"
                exit 1
              fi

              echo "Waiting for previous version... ($i/15)"
              sleep 2
            done

            echo "ROLLBACK FAILED"
            docker logs --tail 100 cabinet-rest || true
            exit 1
          EOF